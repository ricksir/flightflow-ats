name: Materialize AI engine extraction

on:
  push:
    branches: [refactor/extract-ai-engine]
    paths:
      - 'tools/extract_ai_engine.py'
      - '.github/workflows/materialize-ai-engine.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout extraction branch
        uses: actions/checkout@v4
        with:
          ref: refactor/extract-ai-engine
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract AI engine when tool exists
        shell: bash
        run: |
          if [ -f tools/extract_ai_engine.py ]; then
            python3 tools/extract_ai_engine.py
          else
            echo 'One-time extraction tool already removed; nothing to materialize.'
          fi

      - name: Validate extracted AI engine
        shell: bash
        run: |
          if [ -f src/ai/ai-engine.js ]; then
            node --check src/ai/ai-engine.js
            test "$(wc -c < src/ai/ai-engine.js)" -eq 165965
            printf '%s  %s\n' '304326300500423f81e250208a5c4eca839b76fb07e5c16c9fa0b30d6689bcd9' 'src/ai/ai-engine.js' | sha256sum --check
          fi

      - name: Static audit
        run: python3 tools/audit_static.py index.html

      - name: Function inventory
        run: python3 tools/function_inventory.py index.html --check

      - name: Validate diff
        run: git diff --check

      - name: Commit extracted AI engine
        shell: bash
        run: |
          if git diff --quiet -- index.html src/ai/ai-engine.js; then
            echo 'No extraction changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html src/ai/ai-engine.js
          git commit -m 'refactor: extract AI engine module'
          git push origin HEAD:refactor/extract-ai-engine
