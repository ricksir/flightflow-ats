name: Materialize Secure Storage extraction

on:
  push:
    branches: [refactor/extract-secure-storage]
    paths:
      - 'tools/extract_secure_storage.py'
      - '.github/workflows/materialize-secure-storage.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout extraction branch
        uses: actions/checkout@v4
        with:
          ref: refactor/extract-secure-storage
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract Secure Storage
        run: python3 tools/extract_secure_storage.py

      - name: Validate extracted JavaScript syntax
        run: node --check src/storage/secure-storage.js

      - name: Validate storage source contract
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('src/storage/secure-storage.js', 'utf8');
          for (const token of [
            "const APP_VERSION = 'FINAL-OFICIAL-SECURE-1.1';",
            "const DB_NAME = 'FlightFlowSecureDB';",
            'const SCHEMA_VERSION = 1;',
            'window.FlightFlowStorage=Object.freeze({',
            'scheduleSnapshot',
            'saveHistory',
            'exportBackup',
            'importBackupFile',
            'validateStorage',
            'deleteRecord',
            'getRecord',
            "typeof selectFile==='function'",
            "typeof loadFile==='function'"
          ]) {
            if (!source.includes(token)) throw new Error(`Contrato ausente: ${token}`);
          }
          console.log('Secure Storage source contract: OK');
          NODE

      - name: Static audit
        run: python3 tools/audit_static.py index.html

      - name: Function inventory
        run: python3 tools/function_inventory.py index.html --check

      - name: Validate diff
        run: git diff --check

      - name: Commit extracted storage module
        shell: bash
        run: |
          if git diff --quiet -- index.html src/storage/secure-storage.js; then
            echo 'No extraction changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html src/storage/secure-storage.js
          git commit -m 'refactor: extract Secure Storage module'
          git push origin HEAD:refactor/extract-secure-storage
