name: Materialize geoOffset extraction

on:
  push:
    branches:
      - refactor/move-geo-offset-to-coordinate-utils
    paths:
      - .github/workflows/materialize-geo-offset-extraction.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize extraction
        run: python3 tools/materialize_geo_offset_extraction.py
      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --no-audit --no-fund
      - name: Static audit
        run: npm run audit
      - name: Function declaration inventory
        run: npm run inventory
      - name: Node regression suite
        run: npm test
      - name: Diff sanity
        run: git diff --check
      - name: Commit production extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/geo/coordinate-utils.js tests/*.test.js
          git diff --cached --quiet && exit 0
          git commit -m "refactor: move geoOffset to coordinate utils"
          git push
