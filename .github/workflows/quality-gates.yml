name: FlightFlow quality gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regression-and-static-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Static audit
        run: npm run audit

      - name: Function declaration inventory
        run: npm run inventory

      - name: Timeline and route regression tests
        run: npm test

      - name: Browser availability
        run: google-chrome --version

      - name: UI navigation regression tests
        run: npm run test:ui
