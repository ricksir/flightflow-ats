name: Materialize issue 4 fix

on:
  push:
    branches: [fix/transport-boundaries]
    paths:
      - 'tools/materialize_issue4_fix.py'
      - '.github/workflows/materialize-issue4.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/transport-boundaries
          fetch-depth: 0

      - name: Apply minimal patch
        run: python3 tools/materialize_issue4_fix.py

      - name: Validate JavaScript syntax
        run: python3 tools/audit_static.py index.html

      - name: Validate diff
        run: git diff --check

      - name: Commit materialized index
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html change to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: preserve transport button boundaries'
          git push origin HEAD:fix/transport-boundaries
