name: Inspect radar tag boundary

on:
  push:
    branches:
      - refactor/extract-radar-tag-controller

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect implementation and consumer contexts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          lines = Path('index.html').read_text(encoding='utf-8').splitlines()
          text = '\n'.join(lines)
          name = 'updateRadarTagPosition'
          match = re.search(r'(?m)^\s*function\s+' + re.escape(name) + r'\s*\(', text)
          if not match:
              raise SystemExit(f'{name} not found')
          start = match.start()
          brace = text.find('{', match.end())
          depth = 0
          quote = None
          escape = False
          i = brace
          while i < len(text):
              ch = text[i]
              if quote:
                  if escape:
                      escape = False
                  elif ch == '\\':
                      escape = True
                  elif ch == quote:
                      quote = None
              else:
                  if ch in "'\"`":
                      quote = ch
                  elif ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              i += 1
          function_line = text.count('\n', 0, start) + 1
          function = text[start:end]
          print(f'FUNCTION_LINE={function_line}')
          print(f'FUNCTION_BYTES={len(function.encode())}')
          print('---FUNCTION---')
          print(function)

          occurrences = [n for n, line in enumerate(lines, 1) if name in line]
          print('---CONTEXTS---')
          for n in occurrences:
              print(f'### around line {n}')
              lo = max(1, n - 8)
              hi = min(len(lines), n + 8)
              for k in range(lo, hi + 1):
                  print(f'{k}: {lines[k-1]}')

          print('---ELS DECLARATIONS / CACHE---')
          for n, line in enumerate(lines, 1):
              if re.search(r'\b(const|let|var)\s+els\b|function\s+cacheElements\b', line):
                  print(f'{n}: {line.strip()}')
          PY
