name: Inspect radar tag boundary

on:
  push:
    branches:
      - refactor/extract-radar-tag-controller

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect implementation and consumers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path('index.html').read_text(encoding='utf-8')
          name = 'updateRadarTagPosition'
          match = re.search(r'(?m)^\s*function\s+' + re.escape(name) + r'\s*\(', text)
          if not match:
              raise SystemExit(f'{name} not found')
          start = match.start()
          brace = text.find('{', match.end())
          depth = 0
          quote = None
          escape = False
          i = brace
          while i < len(text):
              ch = text[i]
              if quote:
                  if escape:
                      escape = False
                  elif ch == '\\':
                      escape = True
                  elif ch == quote:
                      quote = None
              else:
                  if ch in "'\"`":
                      quote = ch
                  elif ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              i += 1
          else:
              raise SystemExit('unterminated function')

          line = text.count('\n', 0, start) + 1
          function = text[start:end]
          print(f'FUNCTION_LINE={line}')
          print(f'FUNCTION_BYTES={len(function.encode())}')
          print('---FUNCTION---')
          print(function)
          print('---CONSUMERS---')
          for n, source_line in enumerate(text.splitlines(), 1):
              if name in source_line and not re.match(r'^\s*function\s+' + re.escape(name) + r'\s*\(', source_line):
                  print(f'{n}: {source_line.strip()}')

          identifiers = sorted(set(re.findall(r'\b[A-Za-z_$][\w$]*\b', function)))
          print('---IDENTIFIERS---')
          print(', '.join(identifiers))
          PY
