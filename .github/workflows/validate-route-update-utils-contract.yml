name: Validate route update utils contract

on:
  push:
    branches:
      - test/freeze-route-update-utils-contract
    paths:
      - tests/route-update-utils-contract.test.js
      - .github/workflows/validate-route-update-utils-contract.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Measure canonical identities
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const crypto=require('node:crypto');
          const html=fs.readFileSync('index.html','utf8');
          const anchor='window.__FlightFlowFirBridge = Object.freeze({';
          const pos=html.indexOf(anchor);
          const open=html.lastIndexOf('<script',pos);
          const bodyStart=html.indexOf('>',open)+1;
          const close=html.indexOf('</script>',pos);
          const kernel=html.slice(bodyStart,close);

          function functionSource(container,name){
            const marker=`  function ${name}(`;
            const start=container.indexOf(marker);
            if(start<0) throw new Error(`${name} ausente`);
            const paren=container.indexOf('(',start);
            let i=paren,depth=0,quote=null,escaped=false;
            while(i<container.length){
              const c=container[i];
              if(quote){
                if(escaped) escaped=false;
                else if(c==='\\') escaped=true;
                else if(c===quote) quote=null;
                i++; continue;
              }
              if(c==="'"||c==='"'||c==='`'){quote=c;i++;continue;}
              if(c==='(') depth++;
              else if(c===')'){depth--;if(depth===0) break;}
              i++;
            }
            let brace=i+1;
            while(/\s/.test(container[brace]||'')) brace++;
            if(container[brace]!=='{') throw new Error('brace ausente');
            depth=0;quote=null;escaped=false;
            for(i=brace;i<container.length;i++){
              const c=container[i];
              if(quote){
                if(escaped) escaped=false;
                else if(c==='\\') escaped=true;
                else if(c===quote) quote=null;
                continue;
              }
              if(c==="'"||c==='"'||c==='`'){quote=c;continue;}
              if(c==='{') depth++;
              else if(c==='}'){
                depth--;
                if(depth===0) return container.slice(start,i+1);
              }
            }
            throw new Error('fim ausente');
          }

          const keySource="  const ROUTE_UPDATE_KEYS = new Set(['route','sid','star','adep','ades','runwayDeparture','runwayArrival','cfl','rfl']);";
          for(const [name,source] of [
            ['ROUTE_UPDATE_KEYS',keySource],
            ['isMeaningfulRouteChange',functionSource(kernel,'isMeaningfulRouteChange')],
            ['isRouteUpdateEvent',functionSource(kernel,'isRouteUpdateEvent')],
          ]){
            console.log(`${name}|bytes=${Buffer.byteLength(source,'utf8')}|lines=${source.split(/\r?\n/).length}|sha=${crypto.createHash('sha256').update(source).digest('hex')}`);
          }
          NODE
