name: Validate route update utils contract

on:
  push:
    branches:
      - test/freeze-route-update-utils-contract
    paths:
      - tests/route-update-utils-contract.test.js
      - .github/workflows/validate-route-update-utils-contract.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: npm install --no-audit --no-fund
      - name: Static audit
        run: npm run audit
      - name: Function declaration inventory
        run: npm run inventory
      - name: Node regression suite
        run: npm test
      - name: Diff sanity
        run: git diff --check origin/main...HEAD
      - name: Contract-only diff
        run: |
          changed="$(git diff --name-only origin/main...HEAD | grep -v '^.github/workflows/validate-route-update-utils-contract.yml$' || true)"
          test "$changed" = "tests/route-update-utils-contract.test.js"
