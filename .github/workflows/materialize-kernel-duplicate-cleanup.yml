name: Materialize kernel duplicate cleanup

on:
  push:
    branches: [refactor/remove-kernel-duplicates]
    paths:
      - 'tools/remove_kernel_duplicates.py'
      - '.github/workflows/materialize-kernel-duplicate-cleanup.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: refactor/remove-kernel-duplicates
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Remove byte-identical duplicate declarations
        run: python3 tools/remove_kernel_duplicates.py

      - name: Validate JavaScript syntax and static structure
        run: |
          python3 tools/audit_static.py index.html
          python3 tools/function_inventory.py index.html --check
          node --test tests/main-kernel-contract.test.js
          git diff --check

      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet -- index.html tools/function_inventory.py tests/main-kernel-contract.test.js; then
            echo 'No cleanup changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tools/function_inventory.py tests/main-kernel-contract.test.js
          git commit -m 'refactor: remove duplicate kernel declarations'
          git push origin HEAD:refactor/remove-kernel-duplicates
