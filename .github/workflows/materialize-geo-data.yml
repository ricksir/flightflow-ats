name: Materialize geographic data extraction

on:
  push:
    branches: [refactor/extract-geo-data]
    paths:
      - 'tools/extract_geo_data.py'
      - '.github/workflows/materialize-geo-data.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout extraction branch
        uses: actions/checkout@v4
        with:
          ref: refactor/extract-geo-data
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract geographic data when tool exists
        shell: bash
        run: |
          if [ -f tools/extract_geo_data.py ]; then
            python3 tools/extract_geo_data.py
          else
            echo 'One-time extraction tool already removed; nothing to materialize.'
          fi

      - name: Validate extracted JavaScript syntax when present
        shell: bash
        run: |
          if [ -f src/data/geo-data.js ]; then
            node --check src/data/geo-data.js
            grep -q 'window.__FLIGHTFLOW_GEO_DATA__' src/data/geo-data.js
          fi

      - name: Static audit
        run: python3 tools/audit_static.py index.html

      - name: Function inventory
        run: python3 tools/function_inventory.py index.html --check

      - name: Validate diff
        run: git diff --check

      - name: Commit extracted geographic data
        shell: bash
        run: |
          if git diff --quiet -- index.html src/data/geo-data.js; then
            echo 'No extraction changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html src/data/geo-data.js
          git commit -m 'refactor: extract geographic data module'
          git push origin HEAD:refactor/extract-geo-data
