name: Materialize FlightParser extraction

on:
  push:
    branches: [refactor/extract-flight-parser]
    paths:
      - 'tools/extract_flight_parser.py'
      - '.github/workflows/materialize-flight-parser.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout extraction branch
        uses: actions/checkout@v4
        with:
          ref: refactor/extract-flight-parser
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract FlightParser
        run: python3 tools/extract_flight_parser.py

      - name: Validate parser CommonJS API
        run: |
          node - <<'NODE'
          const api = require('./src/parser/flight-parser.js');
          if (!api || typeof api !== 'object') throw new Error('FlightParser não exportou objeto CommonJS.');
          if (typeof api.parseHistory !== 'function') throw new Error('FlightParser.parseHistory não está disponível.');
          console.log('FlightParser CommonJS smoke test: OK');
          NODE

      - name: Static audit
        run: python3 tools/audit_static.py index.html

      - name: Function inventory
        run: python3 tools/function_inventory.py index.html --check

      - name: Validate diff
        run: git diff --check

      - name: Commit extracted parser
        shell: bash
        run: |
          if git diff --quiet -- index.html src/parser/flight-parser.js; then
            echo 'No extraction changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html src/parser/flight-parser.js
          git commit -m 'refactor: extract FlightParser into external module'
          git push origin HEAD:refactor/extract-flight-parser
