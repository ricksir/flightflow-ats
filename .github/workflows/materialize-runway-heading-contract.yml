name: Map runway geometry cluster

on:
  push:
    branches:
      - test/freeze-runway-heading-contract
    paths:
      - .github/workflows/materialize-runway-heading-contract.yml

permissions:
  contents: read

jobs:
  map:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Map runway cluster
        run: python3 tools/materialize_runway_heading_contract.py
