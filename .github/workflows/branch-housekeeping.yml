name: Repository branch housekeeping

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: repository-branch-housekeeping
  cancel-in-progress: false

jobs:
  cleanup:
    name: Remove closed temporary branches
    runs-on: ubuntu-latest
    steps:
      - name: Delete safe stale branches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["GH_REPOSITORY"]
          default_branch = os.environ.get("GH_DEFAULT_BRANCH") or "main"
          api = os.environ.get("GITHUB_API_URL") or "https://api.github.com"
          safe_prefixes = ("analysis/", "chore/", "docs/", "refactor/", "test/")
          legacy_orphans = {
              "chore/map-next-kernel-candidates",
              "refactor/extract-aircraft-visual-utils",
              "refactor/move-validate-config-to-module",
              "test/freeze-format-address-code-v0.3.0",
              "test/freeze-ground-midpoint-contract",
          }

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "flightflow-repository-housekeeping",
          }

          def api_request(method, path):
              request = urllib.request.Request(api + path, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(request) as response:
                      raw = response.read()
                      return json.loads(raw) if raw else None
              except urllib.error.HTTPError as error:
                  body = error.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"{method} {path} -> HTTP {error.code}: {body}") from error

          def paginate(path):
              page = 1
              items = []
              separator = "&" if "?" in path else "?"
              while True:
                  batch = api_request("GET", f"{path}{separator}page={page}&per_page=100")
                  if not batch:
                      break
                  items.extend(batch)
                  if len(batch) < 100:
                      break
                  page += 1
              return items

          branches = paginate(f"/repos/{repo}/branches?")
          open_prs = paginate(f"/repos/{repo}/pulls?state=open")
          closed_prs = paginate(f"/repos/{repo}/pulls?state=closed")

          def local_head_refs(prs):
              refs = set()
              for pr in prs:
                  head = pr.get("head") or {}
                  head_repo = head.get("repo") or {}
                  if head_repo.get("full_name") == repo and head.get("ref"):
                      refs.add(head["ref"])
              return refs

          open_refs = local_head_refs(open_prs)
          closed_refs = local_head_refs(closed_prs)

          candidates = []
          for entry in branches:
              name = entry["name"]
              if name == default_branch:
                  continue
              if entry.get("protected"):
                  continue
              if not name.startswith(safe_prefixes):
                  continue
              if name in open_refs:
                  continue

              # analysis/* is an explicitly disposable namespace.
              # Other maintenance branches still require a closed PR record,
              # except for the small audited list of legacy orphans below.
              disposable_analysis = name.startswith("analysis/")
              historically_closed = name in closed_refs
              audited_legacy_orphan = name in legacy_orphans
              if not (disposable_analysis or historically_closed or audited_legacy_orphan):
                  continue

              candidates.append(name)

          deleted = []
          failures = []
          for name in sorted(candidates):
              encoded = urllib.parse.quote(name, safe="/")
              path = f"/repos/{repo}/git/refs/heads/{encoded}"
              try:
                  api_request("DELETE", path)
                  deleted.append(name)
                  print(f"deleted: {name}")
              except RuntimeError as error:
                  message = str(error)
                  if "HTTP 404" in message:
                      print(f"already absent: {name}")
                      continue
                  failures.append(message)
                  print(f"ERROR: {message}", file=sys.stderr)

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as summary:
                  summary.write("## Branch housekeeping\n\n")
                  summary.write(f"- safe candidates: **{len(candidates)}**\n")
                  summary.write(f"- deleted: **{len(deleted)}**\n")
                  summary.write(f"- failures: **{len(failures)}**\n")
                  summary.write("- `release/*`, protected branches and branches with open PRs are always preserved.\n")
                  summary.write("- `analysis/*` is treated as disposable when no PR is open; other orphan cleanup is explicit and audited.\n")

          if failures:
              raise SystemExit(1)
          PY
