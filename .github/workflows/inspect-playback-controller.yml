name: Inspect playback controller contract

on:
  push:
    branches: [test/playback-controller-contract]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print playback functions
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const crypto=require('node:crypto');
          const html=fs.readFileSync('index.html','utf8');
          const anchor='window.__FlightFlowFirBridge = Object.freeze({';
          const ai=html.indexOf(anchor),ss=html.lastIndexOf('<script',ai),bs=html.indexOf('>',ss)+1,be=html.indexOf('</script>',ai);
          const source=html.slice(bs,be);
          function scan(text,oi,oc,cc){let d=0,m='code',q='',e=false;for(let i=oi;i<text.length;i++){const c=text[i],n=text[i+1]||'';if(m==='line'){if(c==='\n')m='code';continue;}if(m==='block'){if(c==='*'&&n==='/'){m='code';i++;}continue;}if(m==='str'){if(e)e=false;else if(c==='\\')e=true;else if(c===q)m='code';continue;}if(m==='tpl'){if(e)e=false;else if(c==='\\')e=true;else if(c==='`')m='code';continue;}if(c==='/'&&n==='/'){m='line';i++;continue;}if(c==='/'&&n==='*'){m='block';i++;continue;}if(c==='"'||c==="'"){m='str';q=c;continue;}if(c==='`'){m='tpl';continue;}if(c===oc)d++;else if(c===cc){d--;if(d===0)return i;}}return -1;}
          function extract(name){const re=new RegExp('(^|\\n)([ \\t]*)function\\s+'+name+'\\s*\\(','g');const ms=[...source.matchAll(re)];if(ms.length!==1)throw new Error(name+' count '+ms.length);const m=ms[0],st=m.index+(m[1]==='\n'?1:0),p=source.indexOf('(',st),pe=scan(source,p,'(',')');let b=pe+1;while(/\s/.test(source[b]||''))b++;const en=scan(source,b,'{','}');return source.slice(st,en+1);}
          for(const name of ['startPlayback','stopPlayback','togglePlayback','scheduleNext']){const body=extract(name);console.log('\n===== '+name+' =====');console.log('bytes='+Buffer.byteLength(body,'utf8'));console.log('sha='+crypto.createHash('sha256').update(body).digest('hex'));console.log(body);}
          NODE
