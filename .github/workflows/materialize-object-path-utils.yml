name: Materialize object path utility extraction

on:
  push:
    branches: [refactor/extract-object-path-utils]
    paths:
      - '.github/workflows/materialize-object-path-utils.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-object-path-utils
      - name: Move frozen helpers into FlightFlowCoreUtils
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const crypto=require('node:crypto');
          let html=fs.readFileSync('index.html','utf8');
          let core=fs.readFileSync('src/core/core-utils.js','utf8');
          const expected={
            getPath:{bytes:138,sha:'247f4a3dd072d9a76e62f80d3b247d7891c65d0b4a3c2082bb4f932dd67963ea'},
            setPath:{bytes:345,sha:'b8e0c78106388a4ced70f669fff1012e9583f6fc1ecfff51e5b2da3a90db1c91'},
          };
          const anchor='window.__FlightFlowFirBridge = Object.freeze({';
          const ai=html.indexOf(anchor),ss=html.lastIndexOf('<script',ai),bs=html.indexOf('>',ss)+1,be=html.indexOf('</script>',ai);
          if(ai<0||ss<0||be<0)throw new Error('main IIFE anchor missing');
          const kernel=html.slice(bs,be);
          function scan(text,oi,oc,cc){let d=0,m='code',q='',e=false;for(let i=oi;i<text.length;i++){const c=text[i],n=text[i+1]||'';if(m==='line'){if(c==='\n')m='code';continue;}if(m==='block'){if(c==='*'&&n==='/'){m='code';i++;}continue;}if(m==='str'){if(e)e=false;else if(c==='\\')e=true;else if(c===q)m='code';continue;}if(m==='tpl'){if(e)e=false;else if(c==='\\')e=true;else if(c==='`')m='code';continue;}if(c==='/'&&n==='/'){m='line';i++;continue;}if(c==='/'&&n==='*'){m='block';i++;continue;}if(c==='"'||c==="'"){m='str';q=c;continue;}if(c==='`'){m='tpl';continue;}if(c===oc)d++;else if(c===cc){d--;if(d===0)return i;}}return-1;}
          function extract(source,name){const re=new RegExp('(^|\\n)([ \\t]*)function\\s+'+name+'\\s*\\(','g');const ms=[...source.matchAll(re)];if(ms.length!==1)throw new Error(`${name}: expected one declaration, got ${ms.length}`);const m=ms[0],st=m.index+(m[1]==='\n'?1:0),p=source.indexOf('(',st),pe=scan(source,p,'(',')');let b=pe+1;while(/\s/.test(source[b]||''))b++;const en=scan(source,b,'{','}');if(en<0)throw new Error(`${name}: unterminated`);return source.slice(st,en+1);}
          const bodies={};
          for(const [name,meta] of Object.entries(expected)){
            const body=extract(kernel,name),bytes=Buffer.byteLength(body,'utf8'),sha=crypto.createHash('sha256').update(body).digest('hex');
            if(bytes!==meta.bytes||sha!==meta.sha)throw new Error(`${name}: contract mismatch bytes=${bytes} sha=${sha}`);
            bodies[name]=body; console.log(`${name}: frozen contract OK bytes=${bytes} sha=${sha}`);
          }
          for(const body of Object.values(bodies)){
            const count=html.split(body).length-1;if(count!==1)throw new Error(`body replacement count ${count}`);html=html.replace(body,'');
          }
          const apiAnchor='  window.FlightFlowCoreUtils = Object.freeze({';
          if((core.split(apiAnchor).length-1)!==1)throw new Error('CoreUtils API anchor mismatch');
          core=core.replace(apiAnchor,`${Object.values(bodies).join('\n\n')}\n${apiAnchor}`);
          const apiTail='    seeded,\n  });';
          if((core.split(apiTail).length-1)!==1)throw new Error('CoreUtils API tail mismatch');
          core=core.replace(apiTail,'    seeded,\n    getPath,\n    setPath,\n  });');
          const alias='  const { shortMessageType, displayValue, cleanDisplay, humanize, clone, formatBytes, angleDifference, hashString, seeded } = CoreUtils;';
          if((html.split(alias).length-1)!==1)throw new Error('CoreUtils alias mismatch');
          html=html.replace(alias,'  const { shortMessageType, displayValue, cleanDisplay, humanize, clone, formatBytes, angleDifference, hashString, seeded, getPath, setPath } = CoreUtils;');
          fs.writeFileSync('index.html',html);fs.writeFileSync('src/core/core-utils.js',core);

          const moduleBytes=Buffer.byteLength(core,'utf8'),moduleSha=crypto.createHash('sha256').update(core).digest('hex');
          const newHtml=fs.readFileSync('index.html','utf8'),nai=newHtml.indexOf(anchor),nss=newHtml.lastIndexOf('<script',nai),nbs=newHtml.indexOf('>',nss)+1,nbe=newHtml.indexOf('</script>',nai),raw=newHtml.slice(nbs,nbe),norm=raw.replace(/^\n+|\n+$/g,'')+'\n';
          const names=[...norm.matchAll(/function\s+([A-Za-z_$][\w$]*)\s*\(/g)].map(m=>m[1]);
          console.log(`core.module.bytes=${moduleBytes}`);console.log(`core.module.sha256=${moduleSha}`);
          console.log(`kernel.raw.bytes=${Buffer.byteLength(raw,'utf8')}`);console.log(`kernel.raw.sha256=${crypto.createHash('sha256').update(raw).digest('hex')}`);
          console.log(`kernel.normalized.bytes=${Buffer.byteLength(norm,'utf8')}`);console.log(`kernel.normalized.lines=${norm.split(/\r?\n/).length-1}`);console.log(`kernel.normalized.sha256=${crypto.createHash('sha256').update(norm).digest('hex')}`);
          console.log(`kernel.namedFunctions=${names.length}`);console.log(`kernel.uniqueNames=${new Set(names).size}`);
          for(const name of Object.keys(expected))if(new RegExp(`function\\s+${name}\\s*\\(`).test(norm))throw new Error(`${name} still inline`);
          NODE
          node --check src/core/core-utils.js
          python3 tools/audit_static.py index.html
      - name: Commit extraction
        shell: bash
        run: |
          git config user.name "ricksir"
          git config user.email "42359465+ricksir@users.noreply.github.com"
          git add index.html src/core/core-utils.js
          git commit -m "refactor: move object path helpers to core utils"
          git push origin HEAD:refactor/extract-object-path-utils
