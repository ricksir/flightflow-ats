name: Materialize playback controller extraction

on:
  push:
    branches: [refactor/extract-playback-controller]
    paths:
      - src/timeline/playback-controller.js
      - .github/workflows/materialize-playback-controller.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-playback-controller
      - name: Replace frozen playback functions with explicit controller factory
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          let html = fs.readFileSync('index.html', 'utf8');
          const modulePath = 'src/timeline/playback-controller.js';
          const moduleSource = fs.readFileSync(modulePath, 'utf8');
          const expected = {
            startPlayback: { bytes: 272, sha: 'e27c3e1eee3c48b1bf731709ff24ef71ff93f42a5886064b0f72b579c8178cd4' },
            stopPlayback: { bytes: 255, sha: '41165a7fd8d9bbde9ca2d253bfe01b678e538e6e07e51e9c3057b61e3c9072ab' },
            togglePlayback: { bytes: 118, sha: '528472ed19d86105a0c455b091b27ed5c94496e9203b7b1e5650442ae0b7f511' },
            scheduleNext: { bytes: 589, sha: 'c80be2e78585bba2901431681caef02c88aa77fc2b1090bac744e6738f9736f6' },
          };
          const anchor = 'window.__FlightFlowFirBridge = Object.freeze({';
          const ai = html.indexOf(anchor);
          const scriptStart = html.lastIndexOf('<script', ai);
          const bodyStart = html.indexOf('>', scriptStart) + 1;
          const bodyEnd = html.indexOf('</script>', ai);
          if (ai < 0 || scriptStart < 0 || bodyStart <= scriptStart || bodyEnd <= bodyStart) throw new Error('main IIFE not found');
          let kernel = html.slice(bodyStart, bodyEnd);

          function scan(text, oi, oc, cc) {
            let d=0,m='code',q='',e=false;
            for(let i=oi;i<text.length;i++){
              const c=text[i],n=text[i+1]||'';
              if(m==='line'){if(c==='\n')m='code';continue;}
              if(m==='block'){if(c==='*'&&n==='/'){m='code';i++;}continue;}
              if(m==='str'){if(e)e=false;else if(c==='\\')e=true;else if(c===q)m='code';continue;}
              if(m==='tpl'){if(e)e=false;else if(c==='\\')e=true;else if(c==='`')m='code';continue;}
              if(c==='/'&&n==='/'){m='line';i++;continue;}
              if(c==='/'&&n==='*'){m='block';i++;continue;}
              if(c==='"'||c==="'"){m='str';q=c;continue;}
              if(c==='`'){m='tpl';continue;}
              if(c===oc)d++;
              else if(c===cc){d--;if(d===0)return i;}
            }
            return -1;
          }

          function extract(name) {
            const re = new RegExp('(^|\\n)([ \\t]*)function\\s+' + name + '\\s*\\(', 'g');
            const matches = [...kernel.matchAll(re)];
            if (matches.length !== 1) throw new Error(`${name}: expected one declaration, got ${matches.length}`);
            const m=matches[0], st=m.index+(m[1]==='\n'?1:0), p=kernel.indexOf('(',st), pe=scan(kernel,p,'(',')');
            let b=pe+1; while(/\s/.test(kernel[b]||'')) b++;
            const en=scan(kernel,b,'{','}');
            if (en < 0) throw new Error(`${name}: unterminated`);
            return { name, start: st, end: en + 1, body: kernel.slice(st, en + 1) };
          }

          const ranges = Object.keys(expected).map(extract);
          for (const item of ranges) {
            const meta=expected[item.name];
            const bytes=Buffer.byteLength(item.body,'utf8');
            const sha=crypto.createHash('sha256').update(item.body).digest('hex');
            if(bytes!==meta.bytes||sha!==meta.sha) throw new Error(`${item.name}: frozen contract mismatch bytes=${bytes} sha=${sha}`);
            console.log(`${item.name}: frozen contract OK bytes=${bytes} sha=${sha}`);
          }
          const first = ranges.find(x => x.name === 'startPlayback');
          if (kernel.indexOf('const state =') > first.start || kernel.indexOf('const els =') > first.start) {
            throw new Error('state/els must be initialized before playback controller creation');
          }
          const replacement = `  const PlaybackController = window.FlightFlowPlaybackController;\n  if (!PlaybackController) throw new Error('FlightFlowPlaybackController não foi carregado.');\n  const { startPlayback, stopPlayback, togglePlayback, scheduleNext } = PlaybackController.create({\n    state,\n    playBtn: els.playBtn,\n    currentEvent: () => currentEvent(),\n    goTo: (index, options) => goTo(index, options),\n    setTimeout: (fn, delay) => window.setTimeout(fn, delay),\n    clearTimeout: timer => window.clearTimeout(timer),\n  });`;

          for (const item of [...ranges].sort((a,b)=>b.start-a.start)) {
            const value = item.name === 'startPlayback' ? replacement : '';
            kernel = kernel.slice(0,item.start) + value + kernel.slice(item.end);
          }
          for (const name of Object.keys(expected)) {
            if (new RegExp(`function\\s+${name}\\s*\\(`).test(kernel)) throw new Error(`${name} still inline`);
          }
          if (!kernel.includes('PlaybackController.create({')) throw new Error('controller factory call missing');

          html = html.slice(0, bodyStart) + kernel + html.slice(bodyEnd);
          const ref = '<script id="flightflow-playback-controller" src="src/timeline/playback-controller.js"></script>\n';
          const newAnchorIndex = html.indexOf(anchor);
          const newScriptStart = html.lastIndexOf('<script', newAnchorIndex);
          if (html.includes('id="flightflow-playback-controller"')) throw new Error('playback script reference already exists');
          html = html.slice(0,newScriptStart) + ref + html.slice(newScriptStart);
          fs.writeFileSync('index.html',html);

          const moduleBytes=Buffer.byteLength(moduleSource,'utf8');
          const moduleSha=crypto.createHash('sha256').update(moduleSource).digest('hex');
          console.log(`playback.module.bytes=${moduleBytes}`);
          console.log(`playback.module.sha256=${moduleSha}`);
          console.log(`index.bytes=${Buffer.byteLength(html,'utf8')}`);
          NODE
          node --check src/timeline/playback-controller.js
          python3 tools/audit_static.py index.html
          python3 tools/function_inventory.py index.html --check
          git diff --check
      - name: Commit extraction
        shell: bash
        run: |
          git config user.name "ricksir"
          git config user.email "42359465+ricksir@users.noreply.github.com"
          git add index.html src/timeline/playback-controller.js
          git commit -m "refactor: extract playback controller"
          git push origin HEAD:refactor/extract-playback-controller
