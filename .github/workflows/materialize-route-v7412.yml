name: Materialize Route Processed v7.4.12 extraction

on:
  push:
    branches: [refactor/extract-route-processed-v7412]
    paths:
      - 'tools/extract_route_processed_v7412.py'
      - '.github/workflows/materialize-route-v7412.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout extraction branch
        uses: actions/checkout@v4
        with:
          ref: refactor/extract-route-processed-v7412
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract Route Processed v7.4.12
        run: python3 tools/extract_route_processed_v7412.py

      - name: Validate extracted JavaScript syntax
        run: node --check src/route/route-processed-v7412.js

      - name: Validate expected route API source contract
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('src/route/route-processed-v7412.js', 'utf8');
          for (const token of [
            "const VERSION = '7.4.12';",
            'function publicApi()',
            'window.FlightFlowRouteProcessedV7412=publicApi();',
            'transitionPlanForEvents',
            'transitionDurations',
            'buildMovementProfile',
            'progressForNativeEventIndex'
          ]) {
            if (!source.includes(token)) throw new Error(`Contrato ausente: ${token}`);
          }
          console.log('Route Processed source contract: OK');
          NODE

      - name: Static audit
        run: python3 tools/audit_static.py index.html

      - name: Function inventory
        run: python3 tools/function_inventory.py index.html --check

      - name: Validate diff
        run: git diff --check

      - name: Commit extracted route module
        shell: bash
        run: |
          if git diff --quiet -- index.html src/route/route-processed-v7412.js; then
            echo 'No extraction changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html src/route/route-processed-v7412.js
          git commit -m 'refactor: extract Route Processed v7.4.12 module'
          git push origin HEAD:refactor/extract-route-processed-v7412
