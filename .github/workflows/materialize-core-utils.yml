name: Materialize core utility extraction

on:
  push:
    branches: [refactor/extract-core-utils]
    paths:
      - 'tools/extract_core_utils.py'
      - '.github/workflows/materialize-core-utils.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout extraction branch
        uses: actions/checkout@v4
        with:
          ref: refactor/extract-core-utils
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract guarded core utility cluster
        run: python3 tools/extract_core_utils.py

      - name: Validate generated module and global structure
        run: |
          node --check src/core/core-utils.js
          python3 tools/audit_static.py index.html
          python3 tools/function_inventory.py index.html --check
          git diff --check

      - name: Commit extracted module
        shell: bash
        run: |
          if git diff --quiet -- index.html src/core/core-utils.js; then
            echo 'No extraction changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html src/core/core-utils.js
          git commit -m 'refactor: extract pure core utilities'
          git push origin HEAD:refactor/extract-core-utils
