name: Validate polygonGeoCentroid contract

on:
  push:
    branches:
      - test/freeze-polygon-geo-centroid-contract
    paths:
      - .github/workflows/validate-polygon-geo-centroid-contract.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --no-audit --no-fund
      - name: Static audit
        run: npm run audit
      - name: Function declaration inventory
        run: npm run inventory
      - name: Node regression suite
        run: npm test
      - name: Diff sanity
        run: git diff --check
