name: One-shot repair aircraft follow initialization

on:
  push:
    branches:
      - refactor/extract-aircraft-follow-controller

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Move follow controller creation after state initialization
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8')
          block = (
              'const AircraftFollowController = window.FlightFlowAircraftFollowController;\n'
              "if (!AircraftFollowController) throw new Error('FlightFlowAircraftFollowController não foi carregado.');\n"
              'const { maybeFollowAircraft } = AircraftFollowController.create({ state, setMapViewBox });\n'
          )
          if html.count(block) != 1:
              raise SystemExit(f'expected exactly one follow initialization block, found {html.count(block)}')
          html = html.replace(block, '', 1)

          needle = '  const state = {'
          state_start = html.find(needle)
          if state_start < 0:
              raise SystemExit('state declaration not found')
          brace = html.find('{', state_start + len('  const state = '))
          if brace < 0:
              raise SystemExit('state initializer opening brace not found')

          depth = 0
          quote = None
          escaped = False
          line_comment = False
          block_comment = False
          end_brace = None
          i = brace
          while i < len(html):
              ch = html[i]
              nxt = html[i + 1] if i + 1 < len(html) else ''
              if line_comment:
                  if ch == '\n':
                      line_comment = False
                  i += 1
                  continue
              if block_comment:
                  if ch == '*' and nxt == '/':
                      block_comment = False
                      i += 2
                      continue
                  i += 1
                  continue
              if quote:
                  if escaped:
                      escaped = False
                  elif ch == '\\':
                      escaped = True
                  elif ch == quote:
                      quote = None
                  i += 1
                  continue
              if ch == '/' and nxt == '/':
                  line_comment = True
                  i += 2
                  continue
              if ch == '/' and nxt == '*':
                  block_comment = True
                  i += 2
                  continue
              if ch in ('\'', '"', '`'):
                  quote = ch
                  i += 1
                  continue
              if ch == '{':
                  depth += 1
              elif ch == '}':
                  depth -= 1
                  if depth == 0:
                      end_brace = i
                      break
              i += 1
          if end_brace is None:
              raise SystemExit('state initializer closing brace not found')

          semicolon = end_brace + 1
          while semicolon < len(html) and html[semicolon] in ' \t\r':
              semicolon += 1
          if semicolon >= len(html) or html[semicolon] != ';':
              raise SystemExit('state declaration semicolon not found')
          insert_at = semicolon + 1
          if insert_at < len(html) and html[insert_at] == '\n':
              insert_at += 1
          html = html[:insert_at] + block + html[insert_at:]

          follow_pos = html.find('const { maybeFollowAircraft } = AircraftFollowController.create({ state, setMapViewBox });')
          if follow_pos <= state_start:
              raise SystemExit('follow controller still initializes before state')
          index_path.write_text(html, encoding='utf-8')

          anchor = 'window.__FlightFlowFirBridge = Object.freeze({'
          anchor_index = html.find(anchor)
          open_index = html.rfind('<script', 0, anchor_index)
          body_start = html.find('>', open_index) + 1
          close_index = html.find('</script>', anchor_index)
          source = html[body_start:close_index].strip('\n') + '\n'
          byte_count = len(source.encode('utf-8'))
          line_count = len(source.splitlines())
          digest = hashlib.sha256(source.encode('utf-8')).hexdigest()

          kernel_path = Path('tests/main-kernel-contract.test.js')
          kernel = kernel_path.read_text(encoding='utf-8')
          kernel = re.sub(r'const EXPECTED_BYTES = \d+;', f'const EXPECTED_BYTES = {byte_count};', kernel, count=1)
          kernel = re.sub(r"const EXPECTED_SHA256 = '[0-9a-f]{64}';", f"const EXPECTED_SHA256 = '{digest}';", kernel, count=1)
          kernel = re.sub(r'const EXPECTED_LINES = \d+;', f'const EXPECTED_LINES = {line_count};', kernel, count=1)
          kernel_path.write_text(kernel, encoding='utf-8')
          print(f'kernel bytes={byte_count} lines={line_count} sha256={digest}')
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate static and Node regression gates
        run: |
          npm run audit
          npm run inventory
          npm test
      - name: Remove temporary diagnostic workflow
        run: rm .github/workflows/diagnose-ui-navigation.yml
      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No repair changes to commit.'
            exit 1
          fi
          git commit -m 'fix: initialize aircraft follow after state'
          git push origin HEAD:refactor/extract-aircraft-follow-controller
