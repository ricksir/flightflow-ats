name: One-shot extract motion transition planner

on:
  push:
    branches:
      - refactor/extract-motion-transition-planner

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply deterministic extraction
        run: python3 tools/one_shot_extract_motion_transition_planner.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Full regression gate
        run: npm run check
      - name: Commit only intended extraction files
        shell: bash
        run: |
          rm tools/one_shot_extract_motion_transition_planner.py
          rm .github/workflows/one-shot-extract-motion-transition-planner.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tests/main-kernel-contract.test.js tools/one_shot_extract_motion_transition_planner.py .github/workflows/one-shot-extract-motion-transition-planner.yml
          git commit -m 'refactor: wire motion transition planner'
          git push origin HEAD:refactor/extract-motion-transition-planner
