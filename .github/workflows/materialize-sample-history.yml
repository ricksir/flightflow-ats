name: Materialize sample history extraction

on:
  push:
    branches: [refactor/extract-sample-history]
    paths:
      - 'tools/extract_sample_history.py'
      - '.github/workflows/materialize-sample-history.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout extraction branch
        uses: actions/checkout@v4
        with:
          ref: refactor/extract-sample-history
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract sample history when tool exists
        shell: bash
        run: |
          if [ -f tools/extract_sample_history.py ]; then
            python3 tools/extract_sample_history.py
          else
            echo 'One-time extraction tool already removed; nothing to materialize.'
          fi

      - name: Validate extracted JavaScript syntax when present
        shell: bash
        run: |
          if [ -f src/data/sample-history.js ]; then
            node --check src/data/sample-history.js
            grep -q 'window.__SAMPLE_HISTORY__' src/data/sample-history.js
          fi

      - name: Static audit
        run: python3 tools/audit_static.py index.html

      - name: Function inventory
        run: python3 tools/function_inventory.py index.html --check

      - name: Validate diff
        run: git diff --check

      - name: Commit extracted sample history
        shell: bash
        run: |
          if git diff --quiet -- index.html src/data/sample-history.js; then
            echo 'No extraction changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html src/data/sample-history.js
          git commit -m 'refactor: extract sample history data module'
          git push origin HEAD:refactor/extract-sample-history
