name: Materialize wrapped-route fix

on:
  push:
    branches:
      - test/real-plan-route-regressions
    paths:
      - .github/workflows/materialize-wrapped-route-fix.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Materialize wrapped-route fix
        run: python3 tools/materialize_wrapped_route_fix.py

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --no-audit --no-fund

      - name: Static audit
        run: npm run audit

      - name: Function declaration inventory
        run: npm run inventory

      - name: Node regression suite
        run: npm test

      - name: Diff sanity
        run: git diff --check

      - name: Commit materialized fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/parser/flight-parser.js src/route/route-processed-v7412.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: preserve wrapped route fields"
          git push
