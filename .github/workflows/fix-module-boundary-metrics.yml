name: Fix module boundary metrics

on:
  push:
    branches:
      - refactor/extract-playback-controller

permissions:
  contents: write

jobs:
  fix-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore previous metrics and refresh playback metrics
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          import re

          p = Path('docs/MODULE-BOUNDARIES.md')
          text = p.read_text(encoding='utf-8')

          wrong_previous = """- corpo bruto do IIFE: **1.143.741 bytes** / SHA-256 `2a368c80164933a8c472bac330f51049b0f0f8e87755da67004d3399a7746ceb`;\n- contrato normalizado do IIFE: **1.143.741 bytes / 5.460 linhas**;\n- SHA-256 normalizado: `2a368c80164933a8c472bac330f51049b0f0f8e87755da67004d3399a7746ceb`;\n"""
          correct_previous = """- corpo bruto do IIFE: **1.144.923 bytes** / SHA-256 `0c136e2f689a5caa5ad676bd091499574ec042ab177ce8ff56593f4c9b77e501`;\n- contrato normalizado do IIFE: **1.144.919 bytes / 5.490 linhas**;\n- SHA-256 normalizado: `4eba80a6f22abeac32e519ddef51afcd7754ea1e514d5c0e8cec7725fe63a92c`;\n"""
          if text.count(wrong_previous) != 1:
              raise SystemExit('bloco de métricas anterior adulterado não encontrado de forma única')
          text = text.replace(wrong_previous, correct_previous, 1)

          heading = '### 15. Primeira extração de timeline/estado: controlador de playback'
          if text.count(heading) != 1:
              raise SystemExit('seção playback não encontrada de forma única')
          prefix, section = text.split(heading, 1)

          module = Path('src/timeline/playback-controller.js').read_bytes()
          module_bytes = len(module)
          module_sha = hashlib.sha256(module).hexdigest()

          html = Path('index.html').read_text(encoding='utf-8')
          anchor = 'window.__FlightFlowFirBridge = Object.freeze({'
          anchor_index = html.index(anchor)
          script_start = html.rfind('<script', 0, anchor_index)
          body_start = html.index('>', script_start) + 1
          body_end = html.index('</script>', anchor_index)
          raw = html[body_start:body_end]
          normalized = raw.strip('\n') + '\n'
          raw_bytes = len(raw.encode('utf-8'))
          raw_sha = hashlib.sha256(raw.encode('utf-8')).hexdigest()
          norm_bytes = len(normalized.encode('utf-8'))
          norm_lines = len(normalized.splitlines())
          norm_sha = hashlib.sha256(normalized.encode('utf-8')).hexdigest()

          replacements = [
              (r'- módulo: \*\*[\d.]+ bytes\*\* / SHA-256 `[0-9a-f]{64}`;',
               f'- módulo: **{module_bytes:,} bytes** / SHA-256 `{module_sha}`;'.replace(',', '.')),
              (r'- corpo bruto do IIFE: \*\*[\d.]+ bytes\*\* / SHA-256 `[0-9a-f]{64}`;',
               f'- corpo bruto do IIFE: **{raw_bytes:,} bytes** / SHA-256 `{raw_sha}`;'.replace(',', '.')),
              (r'- contrato normalizado do IIFE: \*\*[\d.]+ bytes / [\d.]+ linhas\*\*;',
               f'- contrato normalizado do IIFE: **{norm_bytes:,} bytes / {norm_lines:,} linhas**;'.replace(',', '.')),
              (r'- SHA-256 normalizado: `[0-9a-f]{64}`;',
               f'- SHA-256 normalizado: `{norm_sha}`;'),
          ]
          for pattern, replacement in replacements:
              section, count = re.subn(pattern, replacement, section, count=1)
              if count != 1:
                  raise SystemExit(f'métrica playback não encontrada: {pattern}')

          p.write_text(prefix + heading + section, encoding='utf-8')
          print(f'playback module={module_bytes} {module_sha}')
          print(f'kernel raw={raw_bytes} {raw_sha}')
          print(f'kernel normalized={norm_bytes} lines={norm_lines} {norm_sha}')

      - name: Verify docs-only diff
        run: |
          git diff --check
          git diff -- docs/MODULE-BOUNDARIES.md
      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/fix-module-boundary-metrics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/MODULE-BOUNDARIES.md .github/workflows/fix-module-boundary-metrics.yml
          git diff --cached --check
          git commit -m "docs: repair module boundary metrics"
          git push
