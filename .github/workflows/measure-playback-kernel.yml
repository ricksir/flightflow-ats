name: Measure playback extraction baseline

on:
  push:
    branches: [refactor/extract-playback-controller]

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Measure module and kernel
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const crypto=require('node:crypto');
          const html=fs.readFileSync('index.html','utf8');
          const module=fs.readFileSync('src/timeline/playback-controller.js','utf8');
          const anchor='window.__FlightFlowFirBridge = Object.freeze({';
          const ai=html.indexOf(anchor), ss=html.lastIndexOf('<script',ai), bs=html.indexOf('>',ss)+1, be=html.indexOf('</script>',ai);
          const raw=html.slice(bs,be), norm=raw.replace(/^\n+|\n+$/g,'')+'\n';
          const sha=x=>crypto.createHash('sha256').update(x).digest('hex');
          const names=[...norm.matchAll(/function\s+([A-Za-z_$][\w$]*)\s*\(/g)].map(m=>m[1]);
          console.log('module.bytes='+Buffer.byteLength(module,'utf8'));
          console.log('module.sha256='+sha(module));
          console.log('kernel.raw.bytes='+Buffer.byteLength(raw,'utf8'));
          console.log('kernel.raw.sha256='+sha(raw));
          console.log('kernel.normalized.bytes='+Buffer.byteLength(norm,'utf8'));
          console.log('kernel.normalized.lines='+(norm.split(/\r?\n/).length-1));
          console.log('kernel.normalized.sha256='+sha(norm));
          console.log('kernel.namedFunctions='+names.length);
          console.log('kernel.uniqueNames='+new Set(names).size);
          NODE
