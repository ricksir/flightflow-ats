name: Inspect playback initialization order

on:
  push:
    branches:
      - refactor/extract-playback-controller

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate playback lifecycle anchors
        shell: python
        run: |
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          needles = [
              'function init(',
              'init();',
              "addEventListener('click', togglePlayback)",
              'addEventListener("click", togglePlayback)',
              'loadDemo(true)',
              'PlaybackController.create({',
              'const { startPlayback, stopPlayback, togglePlayback, scheduleNext }',
              'startPlayback();',
              'togglePlayback);',
          ]
          lines = text.splitlines()
          for needle in needles:
              print(f'=== {needle} ===')
              found = False
              for i, line in enumerate(lines, 1):
                  if needle in line:
                      found = True
                      lo = max(1, i - 3)
                      hi = min(len(lines), i + 3)
                      print(f'line {i}')
                      for n in range(lo, hi + 1):
                          print(f'{n:05d}: {lines[n-1]}')
              if not found:
                  print('NOT FOUND')
