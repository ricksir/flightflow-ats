name: Materialize FIR layers extraction

on:
  push:
    branches: [refactor/extract-fir-layers]
    paths:
      - 'tools/extract_fir_layers.py'
      - '.github/workflows/materialize-fir-layers.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout extraction branch
        uses: actions/checkout@v4
        with:
          ref: refactor/extract-fir-layers
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract FIR layers
        run: python3 tools/extract_fir_layers.py

      - name: Validate extracted JavaScript syntax
        run: node --check src/map/fir-layers.js

      - name: Validate FIR source contract
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('src/map/fir-layers.js', 'utf8');
          for (const token of [
            'const bridge=window.__FlightFlowFirBridge;',
            "const FIR_STORAGE_KEY='flightflow-manual-firs-v1';",
            'SBBSZQZX', 'SBAZZQZX', 'SBCWZQZX', 'SBREZQZX',
            'window.renderManualFirLayers=renderManualFirLayers;',
            "window.addEventListener('storage'",
            "document.addEventListener('DOMContentLoaded'"
          ]) {
            if (!source.includes(token)) throw new Error(`Contrato ausente: ${token}`);
          }
          console.log('FIR source contract: OK');
          NODE

      - name: Static audit
        run: python3 tools/audit_static.py index.html

      - name: Function inventory
        run: python3 tools/function_inventory.py index.html --check

      - name: Validate diff
        run: git diff --check

      - name: Commit extracted FIR module
        shell: bash
        run: |
          if git diff --quiet -- index.html src/map/fir-layers.js; then
            echo 'No extraction changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html src/map/fir-layers.js
          git commit -m 'refactor: extract FIR layers module'
          git push origin HEAD:refactor/extract-fir-layers
