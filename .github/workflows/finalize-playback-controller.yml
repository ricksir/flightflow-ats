name: Finalize playback controller extraction

on:
  push:
    branches: [refactor/extract-playback-controller]
    paths:
      - tests/main-kernel-contract.test.js
      - tests/playback-controller-contract.test.js
      - tests/e2e/playback-controller.spec.js
      - .github/workflows/finalize-playback-controller.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-playback-controller
      - name: Record timeline boundary and remove temporary workflows
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const docPath = 'docs/MODULE-BOUNDARIES.md';
          let doc = fs.readFileSync(docPath, 'utf8');
          const row = '| playback/timer / `window.FlightFlowPlaybackController` | **externo em `src/timeline/playback-controller.js`** |\n';
          const iifeRow = '| IIFE principal `FlightFlow ATS - TIOP Cindacta1` | ainda inline; decomposição continua **por domínio** |\n';
          if (!doc.includes(row) && doc.includes(iifeRow)) doc = doc.replace(iifeRow, row + iifeRow);
          doc = doc.replace('O grande IIFE principal permanece inline, agora com **361 funções nomeadas** e sem duplicações internas.', 'O grande IIFE principal permanece inline, agora com **351 funções nomeadas** e sem duplicações internas após a primeira extração do domínio timeline/estado.');
          const sectionTitle = '### 15. Primeira extração de timeline/estado: controlador de playback';
          if (!doc.includes(sectionTitle)) {
            doc += `\n\n${sectionTitle}\n\nO domínio timeline/estado começou pela subfronteira de menor acoplamento. Antes do corte, o PR #31 congelou em Node e Chrome o comportamento de \`startPlayback\`, \`stopPlayback\`, \`togglePlayback\` e \`scheduleNext\`, incluindo reinício no primeiro evento quando Play é acionado no fim, cancelamento de timer, velocidade/ênfase ATS, piso de 350 ms e término exato no último evento.\n\nA implementação foi movida para \`src/timeline/playback-controller.js\` e publicada como \`window.FlightFlowPlaybackController = Object.freeze({ create })\`. A fábrica recebe explicitamente \`state\`, botão Play, \`currentEvent\`, \`goTo\`, \`setTimeout\` e \`clearTimeout\`; o módulo não importa diretamente rota processada, mapa, aeronave, storage ou parser. \`goTo\`, \`renderCurrent\`, \`buildTimeline\` e \`enableControls\` permanecem no IIFE.\n\nContratos após a extração:\n\n- módulo: **2.426 bytes** / SHA-256 \`fbb16dca96619407c8f41df7bd08ccdf1f1a1e13b81be035b662ab55310d1c41\`;\n- corpo bruto do IIFE: **1.143.736 bytes** / SHA-256 \`b56a79bd9b1d5cefbd795851a566fa47ebb2c13ad6a889d88d7a7c3526a3da0e\`;\n- contrato normalizado do IIFE: **1.143.732 bytes / 5.460 linhas**;\n- SHA-256 normalizado: \`c91da8d798192b0b0764a717a9dd464046810d1eac6066681d94d07f1615e41e\`;\n- **351 funções nomeadas / 351 nomes únicos / zero duplicações internas** no núcleo;\n- inventário global permanece em **722 declarações / 711 nomes únicos / 9 repetições conhecidas**, pois a fábrica usa expressão arrow e as quatro declarações apenas mudaram de fronteira.\n\nProteções: \`tests/playback-controller-contract.test.js\`, \`tests/e2e/playback-controller.spec.js\`, \`tests/e2e/ui-navigation.spec.js\`, \`tests/main-kernel-contract.test.js\`, auditoria, inventário e regressão 78→79.\n`;
          }
          fs.writeFileSync(docPath, doc);

          const changelogPath = 'CHANGELOG.md';
          let changelog = fs.readFileSync(changelogPath, 'utf8');
          const entry = '- Extraído o controlador de playback (`startPlayback`, `stopPlayback`, `togglePlayback`, `scheduleNext`) para `src/timeline/playback-controller.js`, com fábrica de dependências explícitas e regressões Node/Chrome.\n';
          if (!changelog.includes(entry.trim())) changelog += (changelog.endsWith('\n') ? '' : '\n') + entry;
          fs.writeFileSync(changelogPath, changelog);

          for (const file of [
            '.github/workflows/materialize-playback-controller.yml',
            '.github/workflows/measure-playback-kernel.yml',
            '.github/workflows/finalize-playback-controller.yml',
          ]) {
            if (fs.existsSync(file)) fs.rmSync(file);
          }
          NODE
          node --check src/timeline/playback-controller.js
          python3 tools/audit_static.py index.html
          python3 tools/function_inventory.py index.html --check
          git diff --check
          git config user.name "ricksir"
          git config user.email "42359465+ricksir@users.noreply.github.com"
          git add -A
          git commit -m "docs: record playback controller boundary"
          git push origin HEAD:refactor/extract-playback-controller
