name: One-shot aircraft visual extraction

on:
  push:
    branches:
      - refactor/move-aircraft-visual-utils-to-module

permissions:
  contents: write

jobs:
  extract-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply mechanical extraction
        run: python3 tools/extract_aircraft_visual_utils.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Full quality gate before commit
        run: npm run check

      - name: Commit extraction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/map/aircraft-visual-utils.js tests/aircraft-visual-utils-contract.test.js tests/e2e/aircraft-visual-utils-module.spec.js tests/main-kernel-contract.test.js
          if git diff --cached --quiet; then
            echo "No extraction changes to commit."
            exit 0
          fi
          git commit -m "refactor: move aircraft visual utils to module"
          git push
