name: Validate aircraft follow contract

on:
  push:
    branches:
      - test/freeze-aircraft-follow-contract

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run focused contract test
        run: node --test tests/aircraft-follow-contract.test.js
      - name: Remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/inspect-aircraft-follow.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/inspect-aircraft-follow.yml
          git commit -m "chore: remove aircraft follow inspection workflow"
          git push
